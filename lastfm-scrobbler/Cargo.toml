[package]
name = "lastfm-scrobbler"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "lastfm-scrobbler"
path = "src/main.rs"

[dependencies]
base64 = "^0.23"
dbus = "0.9"
env_logger = "0.11.8"
log = "0.4"
quick-xml = "^0.42"
scrobl = "0.3"
rusqlite = { version = "^0.43", features = ["bundled"] }
tokio = { version = "1", features = ["net", "rt-multi-thread", "time"] }
