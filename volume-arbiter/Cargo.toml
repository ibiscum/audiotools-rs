[package]
name = "volume-arbiter"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "volume-arbiter"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
env_logger = "0.11.8"
log = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
